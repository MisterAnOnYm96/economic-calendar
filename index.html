<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#000000">
    <title>Economic Calendar</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            color-scheme: dark;
            --ec-bg: #000000;
            --ec-panel: #121212;
            --ec-panel-2: #1e1e1e;
            --ec-border: #2a2a2a;
            --ec-text: #ffffff;
            --ec-muted: #888888;
            --ec-accent: #3b82f6;
            --ec-green: #22c55e;
            --ec-red: #ef4444;
            --ec-orange: #f59e0b;
        }

        body {
            margin: 0;
            background: var(--ec-bg);
            color: var(--ec-text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow-x: hidden;
        }

        .ec-page {
            width: min(600px, 100%);
            margin: 0 auto;
            padding: 20px 16px 40px;
        }

        /* Header qismi */
        .ec-header {
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .ec-title-wrap { display: flex; flex-direction: column; gap: 4px; }
        .ec-header h1 { margin: 0; font-size: 24px; font-weight: 700; }
        .ec-subtitle { color: var(--ec-muted); font-size: 13px; margin: 0; }

        .ec-refresh {
            border: none;
            border-radius: 50%;
            background: var(--ec-panel-2);
            color: var(--ec-text);
            width: 44px; height: 44px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .ec-refresh:hover { background: #333; }
        .ec-refresh:disabled { opacity: .6; cursor: wait; }

        /* Filtr va Kunlar paneli */
        .ec-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: nowrap; gap: 10px;
            background: var(--ec-panel); border-radius: 16px;
            padding: 8px; margin-bottom: 20px;
        }

        .ec-range-tabs {
            display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
        }
        .ec-range-tabs::-webkit-scrollbar { display: none; }

        .ec-range-tabs button {
            border: none; border-radius: 12px;
            padding: 10px 14px; background: transparent;
            color: var(--ec-muted); cursor: pointer; font-size: 13px;
            font-weight: 600; white-space: nowrap; transition: 0.2s;
        }

        .ec-range-tabs button.is-active {
            background: var(--ec-panel-2); color: var(--ec-text);
        }

        .ec-filter-btn {
            border: none; border-radius: 12px;
            background: var(--ec-panel-2); color: var(--ec-text);
            width: 42px; height: 42px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; transition: 0.2s;
        }
        .ec-filter-btn:hover { background: #333; }

        /* Yangiliklar ro'yxati (Card uslubida) */
        .ec-events-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .ec-event-card {
            display: flex;
            background: var(--ec-panel);
            border-radius: 16px;
            overflow: hidden;
            position: relative;
        }

        /* Chap tarafdagi rangli chiziq (High - qizil, Medium - sariq, Low - yashil) */
        .ec-event-card::before {
            content: '';
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 4px;
            background: var(--ec-border);
        }
        .ec-event-card.impact-high::before { background: var(--ec-red); }
        .ec-event-card.impact-medium::before { background: var(--ec-orange); }
        .ec-event-card.impact-low::before { background: var(--ec-green); }

        /* Chap ustun: Vaqt */
        .ec-card-time-col {
            width: 90px;
            padding: 16px 10px 16px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex-shrink: 0;
        }

        .ec-card-time {
            font-size: 15px;
            font-weight: 600;
            color: var(--ec-text);
        }

        .ec-card-timer {
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 2px;
        }
        .ec-card-timer.future { color: var(--ec-green); }
        .ec-card-timer.past { color: var(--ec-red); }

        /* O'ng ustun: Ma'lumotlar */
        .ec-card-content {
            flex-grow: 1;
            padding: 16px 16px 16px 0;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .ec-card-header {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .ec-card-flag {
            width: 24px; height: 16px;
            border-radius: 3px;
            object-fit: cover;
            margin-top: 2px;
        }

        .ec-card-title {
            font-size: 15px;
            font-weight: 600;
            line-height: 1.3;
        }

        /* Daraja yulduzchalari */
        .ec-card-stars {
            display: flex;
            gap: 2px;
            margin-top: -4px;
        }
        .ec-star {
            font-size: 14px;
            color: #333; /* Bo'sh yulduz rangi */
        }
        .ec-star.active-high { color: var(--ec-red); }
        .ec-star.active-medium { color: var(--ec-orange); }
        .ec-star.active-low { color: var(--ec-green); }

        /* Pastki qism: Forecast / Previous */
        .ec-card-data {
            display: flex;
            border-top: 1px solid var(--ec-border);
            padding-top: 12px;
            gap: 20px;
        }

        .ec-data-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .ec-data-label {
            font-size: 10px;
            color: var(--ec-muted);
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .ec-data-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--ec-text);
        }

        /* Empty state */
        .ec-empty {
            display: flex; min-height: 200px; flex-direction: column;
            align-items: center; justify-content: center; gap: 8px;
            color: var(--ec-muted); text-align: center; padding: 24px;
            background: var(--ec-panel); border-radius: 16px;
        }
        .ec-empty strong { color: var(--ec-text); font-size: 16px; }
        .ec-empty span { font-size: 13px; }

        /* ================= MODAL ================= */
        .ec-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(4px);
            z-index: 1000; opacity: 0; visibility: hidden; transition: all 0.3s ease;
        }
        .ec-modal-overlay.is-open { opacity: 1; visibility: visible; }

        .ec-modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--ec-panel); border-top-left-radius: 24px; border-top-right-radius: 24px;
            padding: 24px; z-index: 1001; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 60vh; overflow-y: auto;
        }
        .ec-modal-overlay.is-open .ec-modal { transform: translateY(0); }

        .ec-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        .ec-modal-header h2 { margin: 0; font-size: 20px; font-weight: 700; }
        .ec-modal-close { background: transparent; border: none; color: var(--ec-muted); font-size: 28px; cursor: pointer; padding: 0; line-height: 1; }

        .ec-impact-filter { display: flex; gap: 10px; margin-bottom: 24px; width: 100%; }
        .ec-impact-filter label {
            flex: 1; display: flex; align-items: center; justify-content: center;
            gap: 8px; background: var(--ec-panel-2); padding: 14px;
            border-radius: 12px; color: var(--ec-muted); font-size: 14px;
            cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
            font-weight: 600;
        }
        .ec-impact-filter label:has(input:checked) { border-color: var(--ec-border); color: var(--ec-text); }
        .ec-impact-filter input { display: none; }

        .ec-currency-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding-bottom: 20px; }
        .ec-currency-item {
            display: flex; align-items: center; justify-content: center;
            gap: 8px; background: var(--ec-panel-2); padding: 14px 10px;
            border-radius: 12px; cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
            font-weight: 600; font-size: 14px;
        }
        .ec-currency-item:hover, .ec-currency-item.is-active { border-color: var(--ec-accent); background: rgba(59, 130, 246, 0.1); }
        .ec-currency-item img { width: 24px; height: 16px; border-radius: 2px; object-fit: cover; }

        .ec-meta { display: flex; align-items: center; justify-content: space-between; color: var(--ec-muted); font-size: 12px; margin-bottom: 16px; font-weight: 500; }
        .ec-status { margin-bottom: 16px; color: var(--ec-muted); font-size: 12px; }
    </style>
</head>
<body>
    <main class="ec-page">
        <header class="ec-header">
            <div class="ec-title-wrap">
                <h1>Economic Calendar</h1>
                <p class="ec-subtitle">Global yangiliklar · Toshkent (UTC+5)</p>
            </div>
            <button id="ec-refresh" class="ec-refresh" type="button">↻</button>
        </header>

        <section class="ec-toolbar">
            <div class="ec-range-tabs">
                <button type="button" data-range="yesterday">Kecha</button>
                <button type="button" data-range="today">Bugun</button>
                <button type="button" data-range="tomorrow">Ertaga</button>
                <button type="button" data-range="7days" class="is-active">Keyingi 7 kun</button>
            </div>
            <button type="button" id="ec-open-filter" class="ec-filter-btn">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
            </button>
        </section>

        <section class="ec-meta">
            <span id="ec-count">0 ta yangilik</span>
            <span id="ec-last-updated">Yuklanmoqda...</span>
        </section>

        <div id="ec-events" class="ec-events-list">
            <div class="ec-empty"><strong>Ma'lumot yuklanmoqda…</strong></div>
        </div>
    </main>

    <!-- Modal -->
    <div class="ec-modal-overlay" id="ec-modal-overlay">
        <div class="ec-modal">
            <div class="ec-modal-header">
                <h2>Filtrlash</h2>
                <button class="ec-modal-close" id="ec-close-filter">&times;</button>
            </div>
            <div class="ec-impact-filter">
                <label><input type="checkbox" data-impact value="high" checked> High</label>
                <label><input type="checkbox" data-impact value="medium" checked> Medium</label>
                <label><input type="checkbox" data-impact value="low" checked> Low</label>
            </div>
            <div class="ec-currency-list" id="ec-currency-list"></div>
        </div>
    </div>

    <script type="module">
        const API_URL = "https://showmytrades.com/api/public/calendar/v1";
        const UPDATE_INTERVAL_MS = 6 * 60 * 60 * 1000;
        const LAST_UPDATE_KEY = "economic_calendar_last_update";
        const TIME_ZONE = "Asia/Tashkent";

        const CURRENCIES = [
            { code: "USD", flag: "us" }, { code: "EUR", flag: "eu" }, { code: "GBP", flag: "gb" },
            { code: "JPY", flag: "jp" }, { code: "AUD", flag: "au" }, { code: "NZD", flag: "nz" },
            { code: "CAD", flag: "ca" }, { code: "CHF", flag: "ch" }, { code: "CNY", flag: "cn" }
        ];

        const state = {
            events: [], lastUpdated: null, loading: false, activeRange: "7days",
            impacts: new Set(["high", "medium", "low"]), currency: "all", refreshTimer: null
        };

        const elements = {};
        let timerInterval = null;

        function getLastUpdate() { return Number(localStorage.getItem(LAST_UPDATE_KEY) || 0); }
        function isRefreshDue(force = false) { return force || !getLastUpdate() || Date.now() - getLastUpdate() >= UPDATE_INTERVAL_MS; }
        function getTashkentDateKey(date = new Date()) { return new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit" }).format(date); }
        
        function shiftDateKey(dateKey, offsetDays) {
            const [year, month, day] = dateKey.split("-").map(Number);
            const date = new Date(Date.UTC(year, month - 1, day + offsetDays));
            return [date.getUTCFullYear(), String(date.getUTCMonth() + 1).padStart(2, "0"), String(date.getUTCDate()).padStart(2, "0")].join("-");
        }

        function getEventDateKey(event) {
            const raw = event.ts ?? event.timestamp ?? event.time ?? event.date;
            if (!raw) return null;
            let date = (typeof raw === "number" || /^\d{10,13}$/.test(String(raw))) 
                ? new Date(Number(String(raw).length === 10 ? raw * 1000 : raw)) : new Date(raw);
            return Number.isNaN(date.getTime()) ? null : getTashkentDateKey(date);
        }

        function normalizeImpact(value) {
            const impact = String(value ?? "").toLowerCase();
            if (["high", "3", "red"].includes(impact)) return "high";
            if (["medium", "med", "2", "orange", "yellow"].includes(impact)) return "medium";
            if (["low", "1", "green"].includes(impact)) return "low";
            return "unknown";
        }

        function normalizeEvent(event, index) {
            const timestamp = Number(event.ts ?? event.timestamp);
            const rawTime = event.time ?? event.date ?? "";
            const parsedDate = Number.isFinite(timestamp) && timestamp > 0
                ? new Date(String(timestamp).length === 10 ? timestamp * 1000 : timestamp) : new Date(rawTime);

            return {
                id: String(event.id ?? event.event_id ?? `${event.currency ?? ""}_${event.title ?? ""}_${event.ts ?? index}`),
                currency: String(event.currency ?? "").toUpperCase(),
                title: String(event.title ?? event.event ?? "Untitled event"),
                time: parsedDate, dateKey: getEventDateKey(event),
                impact: normalizeImpact(event.impact ?? event.impact_level),
                actual: event.actual ?? null, forecast: event.forecast ?? event.consensus ?? null, previous: event.previous ?? null
            };
        }

        function formatTime(date) {
            if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
            return new Intl.DateTimeFormat("uz-UZ", { timeZone: TIME_ZONE, hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
        }

        // HH:MM va so'z bilan (3h 49m) formatida taymer
        function getCountdown(targetDate) {
            if (!(targetDate instanceof Date) || Number.isNaN(targetDate.getTime())) return null;
            const now = new Date();
            const diffMs = targetDate.getTime() - now.getTime();
            const isPast = diffMs < 0;
            const absMs = Math.abs(diffMs);

            const hours = Math.floor(absMs / (1000 * 60 * 60));
            const minutes = Math.floor((absMs % (1000 * 60 * 60)) / (1000 * 60));
            
            let text = "";
            if (hours > 0) text += `${hours}h `;
            text += `${minutes}m`;

            return { text: text.trim(), isPast };
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
        }

        function getRangeBounds(range) {
            const today = getTashkentDateKey();
            switch (range) {
                case "yesterday": return [shiftDateKey(today, -1), shiftDateKey(today, -1)];
                case "today": return [today, today];
                case "tomorrow": return [shiftDateKey(today, 1), shiftDateKey(today, 1)];
                default: return [today, shiftDateKey(today, 7)];
            }
        }

        function getFilteredEvents() {
            const [from, to] = getRangeBounds(state.activeRange);
            return state.events
                .filter(event => event.dateKey && event.dateKey >= from && event.dateKey <= to)
                .filter(event => state.impacts.has(event.impact))
                .filter(event => state.currency === "all" || event.currency === state.currency)
                .sort((a, b) => (a.time?.getTime() || 0) - (b.time?.getTime() || 0));
        }

        function renderCurrencyList() {
            if (!elements.currencyList) return;
            elements.currencyList.innerHTML = CURRENCIES.map(curr => {
                const isActive = (state.currency === curr.code);
                return `
                    <div class="ec-currency-item ${isActive ? 'is-active' : ''}" data-currency="${curr.code}">
                        <img src="https://flagcdn.com/w40/${curr.flag}.png" alt="${curr.code}">
                        <span>${curr.code}</span>
                    </div>
                `;
            }).join("");

            elements.currencyList.querySelectorAll(".ec-currency-item").forEach(item => {
                item.addEventListener("click", () => {
                    const code = item.dataset.currency;
                    state.currency = (state.currency === code) ? "all" : code;
                    renderCurrencyList(); renderEvents();
                });
            });
        }

        // Yulduzchalarni chizish funksiyasi
        function renderStars(impact) {
            let starsHtml = '<div class="ec-card-stars">';
            const maxStars = 3;
            let activeCount = 0;
            let activeClass = "";

            if (impact === "high") { activeCount = 3; activeClass = "active-high"; }
            else if (impact === "medium") { activeCount = 2; activeClass = "active-medium"; }
            else if (impact === "low") { activeCount = 1; activeClass = "active-low"; }

            for (let i = 0; i < maxStars; i++) {
                const isActive = i < activeCount;
                starsHtml += `<span class="ec-star ${isActive ? activeClass : ''}">★</span>`;
            }
            starsHtml += '</div>';
            return starsHtml;
        }

        function renderEvents() {
            if (!elements.list) return;
            const events = getFilteredEvents();

            elements.count.textContent = `${events.length} ta yangilik`;
            elements.lastUpdated.textContent = state.lastUpdated
                ? `${new Intl.DateTimeFormat("uz-UZ", { timeZone: TIME_ZONE, hour: "2-digit", minute: "2-digit" }).format(state.lastUpdated)} da yangilandi`
                : "Hali yangilanmagan";

            if (!events.length) {
                elements.list.innerHTML = `<div class="ec-empty"><strong>Yangilik topilmadi</strong><span>Tanlangan filtrlarga mos ma'lumot yo'q.</span></div>`;
                return;
            }

            elements.list.innerHTML = events.map(event => {
                const currData = CURRENCIES.find(c => c.code === event.currency);
                const flagHtml = currData && currData.flag 
                    ? `<img src="https://flagcdn.com/w40/${currData.flag}.png" class="ec-card-flag" alt="${event.currency}">` 
                    : `<div class="ec-card-flag" style="background:#333"></div>`;

                const countdown = getCountdown(event.time);
                const timerClass = countdown && countdown.isPast ? "past" : "future";
                const timerText = countdown ? countdown.text : "";
                
                // Faqat mavjud ma'lumotlarni ko'rsatish (bo'sh bo'lsa yashirish)
                let dataHtml = '';
                if (event.forecast || event.previous) {
                    dataHtml = `<div class="ec-card-data">`;
                    if (event.forecast !== null) {
                        dataHtml += `<div class="ec-data-item"><span class="ec-data-label">Forecast</span><span class="ec-data-value">${escapeHTML(event.forecast)}</span></div>`;
                    }
                    if (event.previous !== null) {
                        dataHtml += `<div class="ec-data-item"><span class="ec-data-label">Previous</span><span class="ec-data-value">${escapeHTML(event.previous)}</span></div>`;
                    }
                    dataHtml += `</div>`;
                }

                return `
                <article class="ec-event-card impact-${event.impact}" data-time="${event.time.getTime()}">
                    <div class="ec-card-time-col">
                        <div class="ec-card-time">${formatTime(event.time)}</div>
                        ${countdown ? `<div class="ec-card-timer ${timerClass}">${timerText}</div>` : ''}
                    </div>
                    
                    <div class="ec-card-content">
                        <div class="ec-card-header">
                            ${flagHtml}
                            <div class="ec-card-title">${escapeHTML(event.title)}</div>
                        </div>
                        ${renderStars(event.impact)}
                        ${dataHtml}
                    </div>
                </article>`;
            }).join("");

            startTimerUpdates();
        }

        function startTimerUpdates() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                document.querySelectorAll(".ec-event-card").forEach(el => {
                    const eventTime = Number(el.getAttribute("data-time"));
                    if (!eventTime) return;
                    const timerEl = el.querySelector(".ec-card-timer");
                    if (!timerEl) return;

                    const countdown = getCountdown(new Date(eventTime));
                    if (countdown) {
                        timerEl.className = `ec-card-timer ${countdown.isPast ? 'past' : 'future'}`;
                        timerEl.textContent = countdown.text;
                    }
                });
            }, 60000); 
        }

        async function fetchEvents() {
            const url = new URL(API_URL);
            url.searchParams.set("impact", "all");
            url.searchParams.set("days", "7");

            const response = await fetch(url.toString(), { headers: { "Accept": "application/json" }, cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const payload = await response.json();
            const rawEvents = Array.isArray(payload) ? payload : payload.events;
            if (!Array.isArray(rawEvents)) throw new Error("API formati xato.");

            state.events = rawEvents.map(normalizeEvent);
            state.lastUpdated = new Date();
            localStorage.setItem(LAST_UPDATE_KEY, String(state.lastUpdated.getTime()));
            renderEvents();
        }

        async function updateCalendar(force = false) {
            if (state.loading) return;
            if (!navigator.onLine) { return; }
            
            if (!isRefreshDue(force)) {
                state.lastUpdated = getLastUpdate() ? new Date(getLastUpdate()) : null;
                renderEvents();
                scheduleNextRefresh();
                return;
            }

            state.loading = true;
            elements.refresh.disabled = true;
            elements.refresh.textContent = "⏳";

            try {
                await fetchEvents();
            } catch (error) {
                console.error(error);
            } finally {
                state.loading = false;
                elements.refresh.disabled = false;
                elements.refresh.textContent = "↻";
                scheduleNextRefresh();
            }
        }

        function scheduleNextRefresh() {
            if (state.refreshTimer) clearTimeout(state.refreshTimer);
            const remaining = getLastUpdate() + UPDATE_INTERVAL_MS - Date.now();
            if (remaining > 0) state.refreshTimer = setTimeout(() => updateCalendar(), remaining);
        }

        function bindControls() {
            document.querySelectorAll("[data-range]").forEach(button => {
                button.addEventListener("click", () => {
                    state.activeRange = button.dataset.range;
                    document.querySelectorAll("[data-range]").forEach(item => item.classList.toggle("is-active", item === button));
                    renderEvents();
                });
            });

            document.querySelectorAll("[data-impact]").forEach(input => {
                input.addEventListener("change", () => {
                    if (input.checked) state.impacts.add(input.value);
                    else state.impacts.delete(input.value);
                    renderEvents();
                });
            });

            elements.openFilterBtn.addEventListener("click", () => elements.modalOverlay.classList.add("is-open"));
            elements.closeFilterBtn.addEventListener("click", () => elements.modalOverlay.classList.remove("is-open"));
            elements.modalOverlay.addEventListener("click", (e) => {
                if (e.target === elements.modalOverlay) elements.modalOverlay.classList.remove("is-open");
            });

            elements.refresh.addEventListener("click", () => updateCalendar(true));
        }

        function init() {
            elements.list = document.getElementById("ec-events");
            elements.count = document.getElementById("ec-count");
            elements.lastUpdated = document.getElementById("ec-last-updated");
            elements.refresh = document.getElementById("ec-refresh");
            elements.currencyList = document.getElementById("ec-currency-list");
            elements.modalOverlay = document.getElementById("ec-modal-overlay");
            elements.openFilterBtn = document.getElementById("ec-open-filter");
            elements.closeFilterBtn = document.getElementById("ec-close-filter");

            renderCurrencyList();
            bindControls();

            const savedTimestamp = getLastUpdate();
            if (savedTimestamp) {
                state.lastUpdated = new Date(savedTimestamp);
                renderEvents();
            }

            updateCalendar();
            window.addEventListener("online", () => updateCalendar());
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
