<!doctype html>
<html lang="uz">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#101827">
    <title>Economic Calendar</title>
    <style>
        * { box-sizing: border-box; }

        :root {
            color-scheme: dark;
            --ec-bg: #0b1220;
            --ec-panel: #111c2e;
            --ec-panel-2: #172338;
            --ec-border: #26364e;
            --ec-text: #e8eef7;
            --ec-muted: #91a0b6;
            --ec-accent: #60a5fa;
            
            --ec-high-bg: #4b252e;
            --ec-high-text: #ff8d8d;
            --ec-medium-bg: #49391f;
            --ec-medium-text: #f5c36b;
            --ec-low-bg: #173e32;
            --ec-low-text: #65d6a0;
        }

        body {
            margin: 0;
            background: var(--ec-bg);
            color: var(--ec-text);
            font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            overflow-x: hidden;
        }

        .ec-page {
            width: min(1200px, calc(100% - 16px));
            margin: 0 auto;
            padding: 16px 0 40px;
        }

        .ec-header {
            margin-bottom: 16px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
        }

        .ec-title-wrap { display: flex; flex-direction: column; gap: 3px; }
        .ec-header h1 { margin: 0; font-size: clamp(20px, 5vw, 34px); line-height: 1.2; }
        .ec-subtitle, .ec-footer { color: var(--ec-muted); font-size: 11px; margin: 0; }

        .ec-refresh {
            border: 1px solid var(--ec-border);
            border-radius: 10px;
            background: var(--ec-panel-2);
            color: var(--ec-text);
            width: 38px; height: 38px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; cursor: pointer; transition: all 0.2s; flex-shrink: 0;
        }
        .ec-refresh:hover { border-color: var(--ec-accent); color: var(--ec-accent); }
        .ec-refresh:disabled { opacity: .6; cursor: wait; }

        .ec-toolbar {
            display: flex; align-items: center; justify-content: space-between;
            flex-wrap: nowrap; gap: 6px;
            background: var(--ec-panel); border: 1px solid var(--ec-border);
            border-radius: 12px; padding: 8px; margin-bottom: 12px;
        }

        .ec-range-tabs { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; scrollbar-width: none; }
        .ec-range-tabs::-webkit-scrollbar { display: none; }
        
        .ec-range-tabs button {
            border: 1px solid transparent; border-radius: 6px;
            padding: 6px 8px; background: transparent; color: var(--ec-muted);
            cursor: pointer; font-size: 11px; white-space: nowrap;
        }
        .ec-range-tabs button.is-active {
            background: #1d3b60; border-color: #315d8c; color: #fff;
        }

        .ec-filter-btn {
            border: 1px solid var(--ec-border); border-radius: 6px;
            background: var(--ec-panel-2); color: var(--ec-text);
            width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; flex-shrink: 0; padding: 0;
        }
        .ec-filter-btn svg { width: 14px; height: 14px; }
        .ec-filter-btn:hover { border-color: var(--ec-accent); color: var(--ec-accent); }

        .ec-meta {
            display: flex; align-items: center; justify-content: space-between;
            color: var(--ec-muted); font-size: 10px; margin: 0 2px 8px;
        }

        .ec-status { margin-bottom: 10px; color: var(--ec-muted); font-size: 10px; min-height: 14px; }
        .ec-status[data-state="error"], .ec-status[data-state="offline"] { color: #f28b82; }
        .ec-status[data-state="ok"] { color: #6fd3a4; }

        /* ================= YANGILIKLAR RO'YXATI ================= */
        .ec-events-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
        }

        .ec-event-row {
            display: flex;
            align-items: flex-start;
            gap: 8px;
            width: 100%;
            transition: opacity 0.3s;
        }

        /* O'tib ketgan yangiliklar uchun xiralik */
        .ec-event-row.is-past {
            opacity: 0.45;
            filter: grayscale(30%);
        }

        /* ================= KUNLAR VA HOZIRGI VAQT UCHUN BADGE'LAR ================= */
        .ec-day-badge-container {
            display: flex;
            justify-content: flex-start;
            margin: 8px 0 4px 0;
            padding-left: 0;
        }

        .ec-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 12px;
            border-radius: 20px; /* Round-end rectangle */
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.5px;
            background: var(--ec-panel-2);
            color: var(--ec-muted);
            border: 1px solid var(--ec-border);
        }

        .ec-badge.is-today {
            background: #1d3b60;
            color: #fff;
            border-color: #315d8c;
        }

        .ec-badge.is-divider {
            background: var(--ec-panel-2);
            color: var(--ec-accent);
            border-color: var(--ec-accent);
            box-shadow: 0 0 8px rgba(96, 165, 250, 0.2);
        }

        /* Vaqt qismi (Chap tomonda, 1/5 qism) */
        .ec-event-time-col {
            width: 20%;
            text-align: right;
            padding-top: 12px;
            font-variant-numeric: tabular-nums;
            color: var(--ec-muted);
            font-size: 13px;
            font-weight: 700;
        }

        /* Kartochka qismi (O'ng tomonda, 4/5 qism) */
        .ec-event-card {
            width: 80%;
            background: var(--ec-panel);
            border: 1px solid var(--ec-border);
            border-radius: 10px;
            padding: 10px 12px;
            border-left: 3px solid var(--ec-border); 
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Impact ranglari */
        .ec-card-high { border-left-color: var(--ec-high-text) !important; }
        .ec-card-medium { border-left-color: var(--ec-medium-text) !important; }
        .ec-card-low { border-left-color: var(--ec-low-text) !important; }
        .ec-card-unknown { border-left-color: var(--ec-muted) !important; }

        .ec-event-heading { display: flex; align-items: center; gap: 6px; margin-bottom: 3px; }
        
        .ec-flag {
            width: 16px; height: 11px; border-radius: 2px;
            object-fit: cover; border: 1px solid rgba(255,255,255,0.1);
        }

        .ec-currency { color: var(--ec-accent); font-weight: 700; font-size: 13px; }

        .ec-event-title { font-size: 14px; font-weight: 600; line-height: 1.3; word-break: break-word; }
        .ec-event-country { color: var(--ec-muted); font-size: 10px; margin-top: 2px; }

        /* ================= ACT, FOR, PRE ================= */
        .ec-values-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0;
            border-top: 1px solid var(--ec-border);
            padding-top: 6px;
        }

        .ec-value-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            gap: 1px;
            padding: 0 2px; 
        }

        .ec-value-box + .ec-value-box {
            border-left: 1px solid var(--ec-border);
        }

        .ec-value-label {
            color: var(--ec-muted);
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 0.5px;
            line-height: 1;
        }

        .ec-value-box strong {
            font-weight: 700;
            font-size: 11px;
            font-variant-numeric: tabular-nums;
            color: var(--ec-text);
            line-height: 1.2;
            text-align: center;
        }

        .ec-empty {
            display: flex; min-height: 150px; flex-direction: column;
            align-items: center; justify-content: center; gap: 6px;
            color: var(--ec-muted); text-align: center; padding: 16px;
            background: var(--ec-panel); border: 1px solid var(--ec-border); border-radius: 12px;
        }
        .ec-empty strong { color: var(--ec-text); font-size: 12px; }
        .ec-empty span { font-size: 10px; }
        .ec-footer { padding: 14px 2px; text-align: center; }

        /* ================= MODAL ================= */
        .ec-modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(2px);
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .ec-modal-overlay.is-open { opacity: 1; visibility: visible; }

        .ec-modal {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--ec-panel); border-top-left-radius: 20px; border-top-right-radius: 20px;
            padding: 16px; z-index: 1001; transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 50vh; overflow-y: auto; box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }
        .ec-modal-overlay.is-open .ec-modal { transform: translateY(0); }

        .ec-modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 8px; border-bottom: 1px solid var(--ec-border);
        }
        .ec-modal-header h2 { margin: 0; font-size: 16px; }
        .ec-modal-close {
            background: transparent; border: none; color: var(--ec-muted);
            font-size: 24px; cursor: pointer; padding: 0; line-height: 1;
        }

        .ec-impact-filter { display: flex; gap: 6px; margin-bottom: 16px; width: 100%; }
        .ec-impact-filter label {
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--ec-panel-2); padding: 10px 4px; border-radius: 8px;
            color: var(--ec-muted); font-size: 11px; cursor: pointer;
            border: 1px solid var(--ec-border); transition: all 0.2s; font-weight: 600;
        }
        .ec-impact-filter input { display: none; }
        
        .ec-impact-filter label:has(input[value="high"]:checked) { background: var(--ec-high-bg); color: var(--ec-high-text); border-color: var(--ec-high-text); }
        .ec-impact-filter label:has(input[value="medium"]:checked) { background: var(--ec-medium-bg); color: var(--ec-medium-text); border-color: var(--ec-medium-text); }
        .ec-impact-filter label:has(input[value="low"]:checked) { background: var(--ec-low-bg); color: var(--ec-low-text); border-color: var(--ec-low-text); }

        .dot { width: 6px; height: 6px; display: inline-block; border-radius: 50%; }
        .dot.high { background: var(--ec-high-text); }
        .dot.medium { background: var(--ec-medium-text); }
        .dot.low { background: var(--ec-low-text); }
        .ec-impact-filter label:has(input:checked) .dot { background: currentColor; }

        .ec-currency-list { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; padding-bottom: 16px; }
        .ec-currency-item {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            background: var(--ec-panel-2); padding: 10px 6px; border-radius: 8px;
            cursor: pointer; border: 1px solid transparent; transition: all 0.2s;
        }
        .ec-currency-item:hover, .ec-currency-item.is-active { border-color: var(--ec-accent); background: #1d3b60; }
        .ec-currency-item img { width: 24px; height: 16px; border-radius: 2px; object-fit: cover; box-shadow: 0 1px 2px rgba(0,0,0,0.3); }
        .ec-currency-item span { font-weight: 700; font-size: 12px; }

        /* Katta ekranlar uchun */
        @media (min-width: 701px) {
            .ec-page { width: min(1200px, calc(100% - 32px)); padding: 28px 0 40px; }
            .ec-header { margin-bottom: 24px; align-items: center; gap: 16px; }
            .ec-header h1 { font-size: clamp(25px, 4vw, 34px); }
            .ec-subtitle { font-size: 13px; }
            .ec-refresh { width: 44px; height: 44px; font-size: 22px; border-radius: 12px; }
            .ec-toolbar { padding: 12px; gap: 10px; margin-bottom: 16px; border-radius: 14px; }
            .ec-range-tabs { gap: 7px; }
            .ec-range-tabs button { padding: 9px 12px; font-size: 13px; border-radius: 8px; }
            .ec-filter-btn { width: 40px; height: 40px; border-radius: 8px; }
            .ec-filter-btn svg { width: 18px; height: 18px; }
            .ec-meta { font-size: 12px; margin: 0 2px 10px; }
            .ec-status { font-size: 12px; min-height: 16px; margin-bottom: 12px; }
            .ec-events-list { gap: 28px; }
            .ec-event-row { gap: 12px; }
            .ec-event-time-col { font-size: 15px; padding-top: 16px; }
            .ec-event-card { padding: 14px 16px; border-radius: 12px; gap: 10px; }
            .ec-flag { width: 18px; height: 13px; }
            .ec-currency { font-size: 14px; }
            .ec-event-title { font-size: 16px; }
            .ec-event-country { font-size: 11px; }
            .ec-value-label { font-size: 10px; }
            .ec-value-box strong { font-size: 13px; }
            .ec-impact-filter label { padding: 12px; font-size: 13px; }
            .ec-currency-item { padding: 14px 10px; }
            .ec-currency-item img { width: 28px; height: 20px; }
            .ec-currency-item span { font-size: 14px; }
            .ec-badge { font-size: 12px; padding: 6px 14px; }
        }
    </style>
</head>
<body>
    <main class="ec-page">
        <header class="ec-header">
            <div class="ec-title-wrap">
                <h1>Economic Calendar</h1>
                <p class="ec-subtitle">Global iqtisodiy yangiliklar · Toshkent vaqti (UTC+5)</p>
            </div>
            <button id="ec-refresh" class="ec-refresh" type="button" aria-label="Yangilash" title="Yangilash">↻</button>
        </header>

        <section class="ec-toolbar" aria-label="Sana va filtrlar">
            <div class="ec-range-tabs">
                <button type="button" data-range="today" class="is-active">Bugun</button>
                <button type="button" data-range="tomorrow">Ertaga</button>
                <button type="button" data-range="7days">Keyingi 7 kun</button>
            </div>
            <button type="button" id="ec-open-filter" class="ec-filter-btn" title="Filtr">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
            </button>
        </section>

        <section class="ec-meta">
            <span id="ec-count">0 ta yangilik</span>
            <span id="ec-last-updated">Hali yangilanmagan</span>
        </section>
        <div id="ec-status" class="ec-status" role="status" aria-live="polite">Kalendar tayyorlanmoqda…</div>

        <div id="ec-events" class="ec-events-list">
            <div class="ec-empty">
                <strong>Ma'lumot yuklanmoqda…</strong>
            </div>
        </div>

        <footer class="ec-footer">
            Manba: ShowMyTrades · Avtomatik yangilanish: 6 soatda bir marta.
        </footer>
    </main>

    <div class="ec-modal-overlay" id="ec-modal-overlay">
        <div class="ec-modal">
            <div class="ec-modal-header">
                <h2>Filtrlash</h2>
                <button class="ec-modal-close" id="ec-close-filter">&times;</button>
            </div>
            
            <div class="ec-impact-filter" aria-label="Impact filtri">
                <label><input type="checkbox" data-impact value="high" checked><i class="dot high"></i> High</label>
                <label><input type="checkbox" data-impact value="medium" checked><i class="dot medium"></i> Medium</label>
                <label><input type="checkbox" data-impact value="low" checked><i class="dot low"></i> Low</label>
            </div>

            <div class="ec-currency-list" id="ec-currency-list">
                <!-- JS orqali to'ldiriladi -->
            </div>
        </div>
    </div>

    <script type="module">
        const API_URL = "https://showmytrades.com/api/public/calendar/v1";
        const UPDATE_INTERVAL_MS = 6 * 60 * 60 * 1000;
        const LAST_UPDATE_KEY = "economic_calendar_last_update";
        const TIME_ZONE = "Asia/Tashkent";

        const CURRENCIES = [
            { code: "USD", flag: "us" }, { code: "EUR", flag: "eu" },
            { code: "GBP", flag: "gb" }, { code: "JPY", flag: "jp" },
            { code: "AUD", flag: "au" }, { code: "NZD", flag: "nz" },
            { code: "CAD", flag: "ca" }, { code: "CHF", flag: "ch" },
            { code: "CNY", flag: "cn" }
        ];

        const state = {
            events: [], lastUpdated: null, loading: false,
            activeRange: "today", // Standart holat "Bugun"
            impacts: new Set(["high", "medium", "low"]),
            currencies: new Set(), refreshTimer: null
        };

        const elements = {};

        function getLastUpdate() {
            const value = Number(localStorage.getItem(LAST_UPDATE_KEY) || 0);
            return Number.isFinite(value) ? value : 0;
        }

        function isRefreshDue(force = false) {
            return force || !getLastUpdate() || Date.now() - getLastUpdate() >= UPDATE_INTERVAL_MS;
        }

        function getTashkentDateKey(date = new Date()) {
            return new Intl.DateTimeFormat("en-CA", { timeZone: TIME_ZONE, year: "numeric", month: "2-digit", day: "2-digit" }).format(date);
        }

        function shiftDateKey(dateKey, offsetDays) {
            const [year, month, day] = dateKey.split("-").map(Number);
            const date = new Date(Date.UTC(year, month - 1, day + offsetDays));
            return [date.getUTCFullYear(), String(date.getUTCMonth() + 1).padStart(2, "0"), String(date.getUTCDate()).padStart(2, "0")].join("-");
        }

        function getEventDateKey(event) {
            const raw = event.ts ?? event.timestamp ?? event.time ?? event.date;
            if (!raw) return null;
            let date = (typeof raw === "number" || /^\d{10,13}$/.test(String(raw))) 
                ? new Date(Number(String(raw).length === 10 ? raw * 1000 : raw)) 
                : new Date(raw);
            return Number.isNaN(date.getTime()) ? null : getTashkentDateKey(date);
        }

        function normalizeImpact(value) {
            const impact = String(value ?? "").toLowerCase();
            if (["high", "3", "red"].includes(impact)) return "high";
            if (["medium", "med", "2", "orange", "yellow"].includes(impact)) return "medium";
            if (["low", "1", "green"].includes(impact)) return "low";
            return "unknown";
        }

        function normalizeEvent(event, index) {
            const timestamp = Number(event.ts ?? event.timestamp);
            const rawTime = event.time ?? event.date ?? "";
            const parsedDate = Number.isFinite(timestamp) && timestamp > 0
                ? new Date(String(timestamp).length === 10 ? timestamp * 1000 : timestamp)
                : new Date(rawTime);

            return {
                id: String(event.id ?? event.event_id ?? `${event.currency ?? ""}_${event.title ?? event.event ?? ""}_${event.ts ?? index}`),
                currency: String(event.currency ?? event.country_currency ?? "").toUpperCase(),
                country: String(event.country ?? event.country_code ?? ""),
                title: String(event.title ?? event.event ?? event.name ?? "Untitled event"),
                time: parsedDate,
                dateKey: getEventDateKey(event),
                impact: normalizeImpact(event.impact ?? event.impact_level),
                actual: event.actual ?? null,
                forecast: event.forecast ?? event.consensus ?? null,
                previous: event.previous ?? null
            };
        }

        function formatTime(date) {
            if (!(date instanceof Date) || Number.isNaN(date.getTime())) return "—";
            return new Intl.DateTimeFormat("uz-UZ", { timeZone: TIME_ZONE, hour: "2-digit", minute: "2-digit", hour12: false }).format(date);
        }

        function formatDateBadge(dateKey, todayKey, tomorrowKey) {
            if (dateKey === todayKey) return "Bugun";
            if (dateKey === tomorrowKey) return "Ertaga";
            const [y, m, d] = dateKey.split("-");
            return `${d}/${m}`;
        }

        function escapeHTML(value) {
            return String(value).replace(/[&<>"']/g, char => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" })[char]);
        }

        function getRangeBounds(range) {
            const today = getTashkentDateKey();
            switch (range) {
                case "today": return [today, today];
                case "tomorrow": return [shiftDateKey(today, 1), shiftDateKey(today, 1)];
                default: return [today, shiftDateKey(today, 7)];
            }
        }

        function getFilteredEvents() {
            const [from, to] = getRangeBounds(state.activeRange);
            return state.events
                .filter(event => event.dateKey && event.dateKey >= from && event.dateKey <= to)
                .filter(event => state.impacts.has(event.impact))
                .filter(event => state.currencies.size === 0 || state.currencies.has(event.currency))
                .sort((a, b) => (a.time?.getTime() || 0) - (b.time?.getTime() || 0));
        }

        function renderCurrencyList() {
            if (!elements.currencyList) return;
            elements.currencyList.innerHTML = CURRENCIES.map(curr => {
                const isActive = state.currencies.has(curr.code);
                return `
                    <div class="ec-currency-item ${isActive ? 'is-active' : ''}" data-currency="${curr.code}">
                        <img src="https://flagcdn.com/w40/${curr.flag}.png" alt="${curr.code}">
                        <span>${curr.code}</span>
                    </div>
                `;
            }).join("");

            elements.currencyList.querySelectorAll(".ec-currency-item").forEach(item => {
                item.addEventListener("click", () => {
                    const code = item.dataset.currency;
                    if (state.currencies.has(code)) state.currencies.delete(code);
                    else state.currencies.add(code);
                    renderCurrencyList();
                    renderEvents();
                });
            });
        }

        function renderEvents() {
            if (!elements.list) return;
            const events = getFilteredEvents();

            elements.count.textContent = `${events.length} ta yangilik`;
            elements.lastUpdated.textContent = state.lastUpdated
                ? `Oxiri: ${new Intl.DateTimeFormat("uz-UZ", { timeZone: TIME_ZONE, dateStyle: "short", timeStyle: "short" }).format(state.lastUpdated)} (Toshkent)`
                : "Hali yangilanmagan";

            if (!events.length) {
                elements.list.innerHTML = `<div class="ec-empty"><strong>Yangilik topilmadi</strong><span>Tanlangan filtrlarga mos ma'lumot yo'q.</span></div>`;
                return;
            }

            const now = Date.now();
            const todayKey = getTashkentDateKey();
            const tomorrowKey = shiftDateKey(todayKey, 1);
            
            let htmlContent = "";
            let lastDateKey = null;
            let currentTimeDividerInserted = false;

            events.forEach(event => {
                const eventTime = event.time instanceof Date ? event.time.getTime() : 0;
                const isPast = eventTime > 0 && eventTime < (now - 60000);

                // 1. Kun o'zgarganini tekshirish va kun badge'ini qo'shish
                if (event.dateKey !== lastDateKey) {
                    lastDateKey = event.dateKey;
                    
                    // Agar bu "Bugun" bo'lsa va hali "Hozirgi vaqt" chizig'i qo'yilmagan bo'lsa
                    if (event.dateKey === todayKey && !currentTimeDividerInserted) {
                        htmlContent += `
                        <div class="ec-day-badge-container">
                            <div class="ec-badge is-today">${formatDateBadge(event.dateKey, todayKey, tomorrowKey)}</div>
                        </div>`;
                    } else {
                        htmlContent += `
                        <div class="ec-day-badge-container">
                            <div class="ec-badge">${formatDateBadge(event.dateKey, todayKey, tomorrowKey)}</div>
                        </div>`;
                    }
                }

                // 2. Hozirgi vaqt ajratgichini qo'shish (faqat birinchi kelgusi yangilik oldidan)
                if (!isPast && !currentTimeDividerInserted) {
                    htmlContent += `
                    <div class="ec-day-badge-container" style="margin-top: 12px;">
                        <div class="ec-badge is-divider">⬤ Hozirgi vaqt</div>
                    </div>`;
                    currentTimeDividerInserted = true;
                }

                // 3. Yangilikni render qilish
                const currData = CURRENCIES.find(c => c.code === event.currency);
                const flagHtml = currData && currData.flag 
                    ? `<img src="https://flagcdn.com/w20/${currData.flag}.png" class="ec-flag" alt="${event.currency}">` 
                    : "";

                const valAct = (event.actual === null || event.actual === undefined || event.actual === "") ? "—" : event.actual;
                const valFor = (event.forecast === null || event.forecast === undefined || event.forecast === "") ? "—" : event.forecast;
                const valPre = (event.previous === null || event.previous === undefined || event.previous === "") ? "—" : event.previous;

                const borderClass = `ec-card-${event.impact}`;

                htmlContent += `
                <div class="ec-event-row ${isPast ? 'is-past' : ''}">
                    <div class="ec-event-time-col">${formatTime(event.time)}</div>
                    
                    <div class="ec-event-card ${borderClass}">
                        <div class="ec-event-main">
                            <div class="ec-event-heading">
                                ${flagHtml}
                                <span class="ec-currency">${escapeHTML(event.currency || "—")}</span>
                            </div>
                            <div class="ec-event-title">${escapeHTML(event.title)}</div>
                            <div class="ec-event-country">${escapeHTML(event.country)}</div>
                        </div>
                        
                        <div class="ec-values-row">
                            <div class="ec-value-box">
                                <span class="ec-value-label">ACT</span>
                                <strong>${escapeHTML(valAct)}</strong>
                            </div>
                            <div class="ec-value-box">
                                <span class="ec-value-label">FOR</span>
                                <strong>${escapeHTML(valFor)}</strong>
                            </div>
                            <div class="ec-value-box">
                                <span class="ec-value-label">PRE</span>
                                <strong>${escapeHTML(valPre)}</strong>
                            </div>
                        </div>
                    </div>
                </div>`;
            });

            // Agar barcha yangiliklar o'tib ketgan bo'lsa (divider oxirigacha qo'yilmasa)
            if (!currentTimeDividerInserted) {
                 htmlContent += `
                    <div class="ec-day-badge-container" style="margin-top: 12px;">
                        <div class="ec-badge is-divider">⬤ Barchasi o'tib ketgan</div>
                    </div>`;
            }

            elements.list.innerHTML = htmlContent;
        }

        async function fetchEvents() {
            const url = new URL(API_URL);
            url.searchParams.set("impact", "all");
            url.searchParams.set("days", "7");

            const response = await fetch(url.toString(), { headers: { "Accept": "application/json" }, cache: "no-store" });
            if (!response.ok) throw new Error(`HTTP ${response.status}`);

            const payload = await response.json();
            const rawEvents = Array.isArray(payload) ? payload : payload.events;
            if (!Array.isArray(rawEvents)) throw new Error("API formati xato.");

            state.events = rawEvents.map(normalizeEvent);
            state.lastUpdated = new Date();
            localStorage.setItem(LAST_UPDATE_KEY, String(state.lastUpdated.getTime()));
            renderEvents();
        }

        async function updateCalendar(force = false) {
            if (state.loading) return;
            if (!navigator.onLine) { setStatus("Internet aloqa yo'q", "offline"); return; }
            
            if (!isRefreshDue(force)) {
                state.lastUpdated = getLastUpdate() ? new Date(getLastUpdate()) : null;
                const remainingMinutes = Math.max(1, Math.ceil((getLastUpdate() + UPDATE_INTERVAL_MS - Date.now()) / 60000));
                setStatus(`Keyingi yangilanish taxminan ${remainingMinutes} daqiqadan so'ng`, "ok");
                renderEvents();
                scheduleNextRefresh();
                return;
            }

            state.loading = true;
            elements.refresh.disabled = true;
            elements.refresh.textContent = "⏳";
            setStatus("Yuklanmoqda…", "loading");

            try {
                await fetchEvents();
                setStatus("Yangilandi · keyingi yangilanish 6 soatdan so'ng", "ok");
            } catch (error) {
                setStatus("Xatolik yuz berdi", "error");
            } finally {
                state.loading = false;
                elements.refresh.disabled = false;
                elements.refresh.textContent = "↻";
                scheduleNextRefresh();
            }
        }

        function scheduleNextRefresh() {
            if (state.refreshTimer) clearTimeout(state.refreshTimer);
            const remaining = getLastUpdate() + UPDATE_INTERVAL_MS - Date.now();
            if (remaining > 0) state.refreshTimer = setTimeout(() => updateCalendar(), remaining);
        }

        function setStatus(message, type) {
            if (!elements.status) return;
            elements.status.textContent = message;
            elements.status.dataset.state = type;
        }

        function bindControls() {
            document.querySelectorAll("[data-range]").forEach(button => {
                button.addEventListener("click", () => {
                    state.activeRange = button.dataset.range;
                    document.querySelectorAll("[data-range]").forEach(item => item.classList.toggle("is-active", item === button));
                    renderEvents();
                });
            });

            document.querySelectorAll("[data-impact]").forEach(input => {
                input.addEventListener("change", () => {
                    if (input.checked) state.impacts.add(input.value);
                    else state.impacts.delete(input.value);
                    renderEvents();
                });
            });

            elements.openFilterBtn.addEventListener("click", () => elements.modalOverlay.classList.add("is-open"));
            elements.closeFilterBtn.addEventListener("click", () => elements.modalOverlay.classList.remove("is-open"));
            elements.modalOverlay.addEventListener("click", (e) => {
                if (e.target === elements.modalOverlay) elements.modalOverlay.classList.remove("is-open");
            });

            elements.refresh.addEventListener("click", () => updateCalendar(true));
        }

        function init() {
            elements.list = document.getElementById("ec-events");
            elements.count = document.getElementById("ec-count");
            elements.lastUpdated = document.getElementById("ec-last-updated");
            elements.status = document.getElementById("ec-status");
            elements.refresh = document.getElementById("ec-refresh");
            elements.currencyList = document.getElementById("ec-currency-list");
            elements.modalOverlay = document.getElementById("ec-modal-overlay");
            elements.openFilterBtn = document.getElementById("ec-open-filter");
            elements.closeFilterBtn = document.getElementById("ec-close-filter");

            renderCurrencyList();
            bindControls();

            const savedTimestamp = getLastUpdate();
            if (savedTimestamp) {
                state.lastUpdated = new Date(savedTimestamp);
                renderEvents();
            }

            updateCalendar();
            window.addEventListener("online", () => updateCalendar());
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") updateCalendar();
            });
        }

        document.addEventListener("DOMContentLoaded", init);
    </script>
</body>
</html>
